[package]
name = "my-app"
# Tauri no usa esta versión: la de la app (instalador, updater, ejecutable) está en package.json y tauri.conf.json la lee
# de ahí. Se deja fija para no tocar Cargo.lock en cada versión.
version = "0.1.0"
description = "Aplicación de escritorio para Windows"
edition = "2024"

[lib]
# La app vive en la biblioteca (main.rs solo la arranca), con un nombre fijo: no cambia al renombrar la app. Solo
# `rlib`: `staticlib` y `cdylib` son para móvil.
name = "app_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
# Lo usa el código que genera `tauri::generate_context!` (la configuración de los plugins).
serde_json = "1"
tauri-plugin-single-instance = "2.5.5"
tauri-plugin-window-state = "2.5.0"
tauri-plugin-log = "2.10.2"
log = "0.4.35"
# Actualizaciones: rustls y el proxy del sistema, sin zip. En Windows el propio instalador reabre la app al terminar,
# así que no hace falta tauri-plugin-process para reiniciarla.
tauri-plugin-updater = { version = "2.14.1", default-features = false, features = ["rustls-tls", "system-proxy"] }

# Optimización y eliminación de símbolos en el ejecutable distribuido.
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[target."cfg(windows)".dependencies]
webview2-com = "0.39.1"
windows = { version = "0.62.2", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_System_LibraryLoader",
  "Win32_UI_HiDpi",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }
