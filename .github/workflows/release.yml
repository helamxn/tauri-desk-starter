# Publicación manual de Windows en el repositorio de la app. Véase docs/release.md.
name: Release

on:
  workflow_dispatch:

# Nada por defecto: cada job pide lo suyo.
permissions: {}

# Una release a la vez y nunca cancelada a medias.
concurrency:
  group: release
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    permissions:
      # Leer el código y la etiqueta de la versión.
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      node: ${{ steps.tools.outputs.node }}
      cli-integrity: ${{ steps.tools.outputs.cli-integrity }}
      native-integrity: ${{ steps.tools.outputs.native-integrity }}
      tauri-cli: ${{ steps.tools.outputs.tauri-cli }}
    steps:
      - name: Only from main
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::Run the release from main."
          exit 1

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Solo Node, para los scripts (sin pnpm ni dependencias). Sin package-manager-cache: no hay pnpm instalado.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false

      - name: Version
        id: version
        run: echo "version=$(node scripts/release.ts version)" >> "$GITHUB_OUTPUT"

      - name: Tools for the sign job
        id: tools
        run: node scripts/release.ts tools >> "$GITHUB_OUTPUT"

      # Sin su sección en CHANGELOG.md no hay notas que publicar.
      - name: Release notes
        run: |
          node scripts/release.ts notes > notes.md
          { echo "## Release notes"; echo; cat notes.md; } >> "$GITHUB_STEP_SUMMARY"

      # La primera versión publicada con un marcador no se podría actualizar nunca.
      - name: No placeholders left
        run: node scripts/release.ts check

      - name: Check release target
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          test "$(gh api "repos/$GITHUB_REPOSITORY" --jq .visibility)" = public || { echo "::error::The updater needs public release assets."; exit 1; }
          # El commit al que apunta v$VERSION en este repositorio, o nada si no existe.
          tagged_commit() {
            local ref
            if ! ref=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/v$VERSION" --jq '.object.type + " " + .object.sha' 2>&1); then
              if [[ "$ref" == *"HTTP 404"* ]]; then return 0; fi
              echo "::error::Couldn't read the tag v$VERSION: $ref" >&2
              return 1
            fi
            local type sha
            read -r type sha <<< "$ref"
            # Una etiqueta anotada (creada a mano) apunta a su objeto: se sigue hasta el commit.
            if [ "$type" = "tag" ]; then gh api "repos/$GITHUB_REPOSITORY/git/tags/$sha" --jq .object.sha; else echo "$sha"; fi
          }
          tagged=$(tagged_commit)
          if [ -n "$tagged" ] && [ "$tagged" != "$GITHUB_SHA" ]; then
            echo "::error::The tag v$VERSION already points to $tagged, not to this commit. Raise the version first."
            exit 1
          fi

          published=$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq ".[] | select(.tag_name == \"v$VERSION\" and (.draft | not)) | .id")
          if [ -n "$published" ]; then echo "::error::This version is already published."; exit 1; fi

  # La CI completa sobre el commit que se publica: se prueba exactamente lo que se compila.
  ci:
    name: CI
    needs: check
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml

  build:
    name: Build (unsigned)
    needs: [check, ci]
    runs-on: windows-latest
    # Sin secretos: aquí se ejecutan las dependencias del proyecto (scripts de instalación, build.rs…). Sin cachés: lo
    # que se publica se compila desde cero, sin restaurar nada que hayan guardado otras ejecuciones.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile

      # Solo NSIS y sin los archivos del updater (tauri.local.conf.json): la firma la hace `sign`.
      - name: Build the installer
        run: pnpm tauri build --bundles nsis --config src-tauri/tauri.local.conf.json -- --locked

      - name: Release files
        run: node scripts/release.ts prepare

      # overwrite: al repetir este job se sustituye el artefacto del intento anterior.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unsigned
          path: release/
          if-no-files-found: error
          retention-days: 7
          overwrite: true

  sign:
    name: Sign
    needs: [check, build]
    runs-on: ubuntu-latest
    # Sin checkout ni dependencias del proyecto: solo el artefacto y la CLI de Tauri fijada a la versión del proyecto.
    permissions: {}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: unsigned
          path: release
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ needs.check.outputs.node }}
          package-manager-cache: false

      - name: Verify the signing tools
        env:
          VERSION: ${{ needs.check.outputs.tauri-cli }}
          CLI_SHA: ${{ needs.check.outputs.cli-integrity }}
          NATIVE_SHA: ${{ needs.check.outputs.native-integrity }}
        run: |
          fetch_verified() {
            local name="$1" expected="$2" dest="$RUNNER_TEMP/signer/node_modules/@tauri-apps/$1"
            curl --fail --silent --show-error --location "https://registry.npmjs.org/@tauri-apps/$name/-/$name-$VERSION.tgz" -o "$RUNNER_TEMP/tool.tgz"
            test "$(openssl dgst -sha512 -binary "$RUNNER_TEMP/tool.tgz" | openssl base64 -A)" = "$expected"
            mkdir -p "$dest"
            tar -xzf "$RUNNER_TEMP/tool.tgz" -C "$dest" --strip-components=1
          }
          fetch_verified cli "$CLI_SHA"
          fetch_verified cli-linux-x64-gnu "$NATIVE_SHA"
          node "$RUNNER_TEMP/signer/node_modules/@tauri-apps/cli/tauri.js" --version

      - name: Sign the installer
        env:
          VERSION: ${{ needs.check.outputs.version }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then echo "::error::Add the TAURI_SIGNING_PRIVATE_KEY secret (see docs/release.md)."; exit 1; fi
          installer="release/assets/$(cat release/installer.txt)"
          node "$RUNNER_TEMP/signer/node_modules/@tauri-apps/cli/tauri.js" signer sign --app-version "$VERSION" "$installer"
          test -s "$installer.sig"

      # latest.json: el de `build` con la firma (el contenido del .sig). El .sig no se publica.
      - name: Complete latest.json
        run: |
          installer="release/assets/$(cat release/installer.txt)"
          jq --rawfile sig "$installer.sig" '.platforms["windows-x86_64"].signature = ($sig | rtrimstr("\n"))' \
            release/latest.unsigned.json > release/assets/latest.json
          rm "$installer.sig" release/latest.unsigned.json release/installer.txt
          jq -e '.platforms["windows-x86_64"].signature | length > 0' release/assets/latest.json > /dev/null

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: release/
          if-no-files-found: error
          retention-days: 7
          overwrite: true

  publish:
    name: Publish
    needs: [check, sign]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: release

      # Primero borrador con los archivos y después pública: latest/download/latest.json nunca apunta a una release a
      # medio subir.
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          tag="v$VERSION"
          marker="<!-- source-commit: $GITHUB_SHA -->"
          # Los reintentos solo sustituyen el borrador creado desde este mismo commit.
          existing=$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            --jq ".[] | select(.tag_name == \"$tag\") | [.id,.draft,((.body // \"\") | endswith(\"$marker\\n\") or endswith(\"$marker\"))] | @tsv")
          while read -r id draft owned; do
            [ -n "$id" ] || continue
            if [ "$owned" != true ]; then echo "::error::Release $tag belongs to another build."; exit 1; fi
            if [ "$draft" = false ]; then echo "$tag is already published."; exit 0; fi
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/$id"
          done <<< "$existing"
          printf '\n%s\n' "$marker" >> release/notes.md
          gh release create "$tag" release/assets/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --draft --title "$tag" --notes-file release/notes.md
          gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --draft=false --latest
